<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <!-- Centre of all arcs: bottom-right corner (100,100).              -->
  <!-- Each arc sweeps 90 degrees counterclockwise from the bottom     -->
  <!-- edge to the right edge, so the rainbow rises from bottom-left   -->
  <!-- to top-right. Outer edge of red grazes (0,100) and (100,0),     -->
  <!-- maximising fill within the square viewBox.                      -->
  <!-- Red -->
  <path d="M 4,100 A 96,96 0 0,0 100,4" fill="none" stroke="#FF3333" stroke-width="8" stroke-linecap="butt"/>
  <!-- Orange -->
  <path d="M 12,100 A 88,88 0 0,0 100,12" fill="none" stroke="#FF8800" stroke-width="8" stroke-linecap="butt"/>
  <!-- Yellow -->
  <path d="M 20,100 A 80,80 0 0,0 100,20" fill="none" stroke="#FFEE00" stroke-width="8" stroke-linecap="butt"/>
  <!-- Green -->
  <path d="M 28,100 A 72,72 0 0,0 100,28" fill="none" stroke="#00AA00" stroke-width="8" stroke-linecap="butt"/>
  <!-- Blue -->
  <path d="M 36,100 A 64,64 0 0,0 100,36" fill="none" stroke="#1155FF" stroke-width="8" stroke-linecap="butt"/>
  <!-- Violet -->
  <path d="M 44,100 A 56,56 0 0,0 100,44" fill="none" stroke="#9933FF" stroke-width="8" stroke-linecap="butt"/>
</svg>