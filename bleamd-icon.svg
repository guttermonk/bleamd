<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <!-- Centre of all arcs: bottom-left corner (0,100). Each arc sweeps 90 degrees   -->
  <!-- from the left edge to the bottom edge. Outer edge of red grazes (0,0)        -->
  <!-- and (100,100), maximising fill within the square viewBox.                    -->
  <!-- Red -->
  <path d="M 0,4 A 96,96 0 0,1 96,100" fill="none" stroke="#FF3333" stroke-width="8" stroke-linecap="butt"/>
  <!-- Orange -->
  <path d="M 0,12 A 88,88 0 0,1 88,100" fill="none" stroke="#FF8800" stroke-width="8" stroke-linecap="butt"/>
  <!-- Yellow -->
  <path d="M 0,20 A 80,80 0 0,1 80,100" fill="none" stroke="#FFEE00" stroke-width="8" stroke-linecap="butt"/>
  <!-- Green -->
  <path d="M 0,28 A 72,72 0 0,1 72,100" fill="none" stroke="#00AA00" stroke-width="8" stroke-linecap="butt"/>
  <!-- Blue -->
  <path d="M 0,36 A 64,64 0 0,1 64,100" fill="none" stroke="#1155FF" stroke-width="8" stroke-linecap="butt"/>
  <!-- Violet -->
  <path d="M 0,44 A 56,56 0 0,1 56,100" fill="none" stroke="#9933FF" stroke-width="8" stroke-linecap="butt"/>
</svg>