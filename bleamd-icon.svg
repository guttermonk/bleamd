<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 52" width="48" height="48">
  <defs>
    <!--
      Radial gradient centred at (50,52) — the bottom-right corner, which is
      also the centre of all the arc radii.  r=49 is the outer edge of red.
      Hard stops (duplicate offsets) give clean colour boundaries with no
      path edges between bands, so anti-aliasing can never create a dark line.
      The innermost region (r < 13) is transparent via stop-opacity="0".
    -->
    <radialGradient id="rg" cx="50" cy="52" r="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%"      stop-color="#9933FF" stop-opacity="0"/>
      <stop offset="26.53%"  stop-color="#9933FF" stop-opacity="0"/>
      <stop offset="26.53%"  stop-color="#9933FF"/>
      <stop offset="38.78%"  stop-color="#9933FF"/>
      <stop offset="38.78%"  stop-color="#1155FF"/>
      <stop offset="51.02%"  stop-color="#1155FF"/>
      <stop offset="51.02%"  stop-color="#00AA00"/>
      <stop offset="63.27%"  stop-color="#00AA00"/>
      <stop offset="63.27%"  stop-color="#FFEE00"/>
      <stop offset="75.51%"  stop-color="#FFEE00"/>
      <stop offset="75.51%"  stop-color="#FF8800"/>
      <stop offset="87.76%"  stop-color="#FF8800"/>
      <stop offset="87.76%"  stop-color="#FF3333"/>
      <stop offset="100%"    stop-color="#FF3333"/>
    </radialGradient>
  </defs>
  <!--
    A single quarter-disk path.  The gradient provides all colour bands and
    the inner transparency — there are no separate path edges between colours.
    Arc: centre (50,52), r=49, from (1,52) sweeping CW to (50,3), then back
    to the centre corner (50,52) to close the sector.
  -->
  <path d="M 1,52 A 49,49 0 0,1 50,3 L 50,52 Z" fill="url(#rg)"/>
</svg>