name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: derive version metadata
        id: version
        shell: bash
        run: |
          GIT_COMMIT=$(git rev-list -1 HEAD)
          GIT_LAST_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo "v0.0.0")
          GIT_EXACT_TAG=$(git name-rev --name-only --tags HEAD 2>/dev/null || echo "undefined")
          echo "git_commit=$GIT_COMMIT"     >> "$GITHUB_OUTPUT"
          echo "git_last_tag=$GIT_LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "git_exact_tag=$GIT_EXACT_TAG" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          OUT="bleamd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X main.GitCommit=${{ steps.version.outputs.git_commit }} \
              -X main.GitLastTag=${{ steps.version.outputs.git_last_tag }} \
              -X main.GitExactTag=${{ steps.version.outputs.git_exact_tag }}" \
            -o "$OUT" .
          ls -lh "$OUT"
          echo "BIN_NAME=$OUT" >> "$GITHUB_ENV"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bleamd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -lhR dist

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bleamd-*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
